[project]
name = "tes-authz-service"
version = "0.1.0"
description = "Engine side of the TES AuthZ contract (tes-authzen/1 and /2): reference decision services, shims and test harness"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "mypy>=1.13",
  "pyjwt[crypto]>=2.10",
  # Runs the hooks of `.pre-commit-config.yaml`; its local hooks use the
  # tools of this group
  "pre-commit>=4.6",
  # The version of uv that CI installs (`astral-sh/setup-uv` reads it from
  # `uv.lock`)
  "uv>=0.12",
  # Project rules of `.ast-grep/` (`sgconfig.yml`), run by the `ast-grep`
  # and `ast-grep-test` hooks
  "ast-grep-cli>=0.51",
  # Reads `compose.yaml` and the Kubernetes manifest in the tests
  "pyyaml>=6.0",
]
# Documentation (`mkdocs.yml`), built by Read the Docs (`.readthedocs.yaml`)
# and in CI. The packages that add warnings, which fail the strict build,
# are listed too, to bound their major versions (new warnings of minor
# releases still fail it)
docs = [
  "mkdocs>=1.6.1,<2",
  "mkdocs-material>=9.7.7,<10",
  "pymdown-extensions>=12.3,<14",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".", "shims", "oidc"]
testpaths = ["tests"]
markers = [
  "services: needs the compose services (make up)",
  "kubernetes: needs the service deployed by scripts/test-kubernetes.sh",
]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "D", "A", "RUF"]
# S310: URLs come from operator configuration and are http(s) by construction.
ignore = ["D203", "D213", "S101", "D105", "D107", "S310"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.ruff.lint.isort]
known-first-party = ["common", "opa_front", "openfga_shim", "harness", "tes", "stub", "minijose", "issuer"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
# Checked by `mypy` without arguments (`make lint`, `scripts/test.sh`, pre-commit)
files = ["shims", "stub", "oidc", "harness", "tes", "engines/openfga", "scripts"]
strict = true
mypy_path = ["shims", "oidc", "."]
explicit_package_bases = true
exclude = ["^\\.venv/", "^\\.cache/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
