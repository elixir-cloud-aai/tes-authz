version: 2
# No entry sets `target-branch`: pull requests go to the default branch
# (`dev`) anyway, and while `target-branch` is set, GitHub doesn't apply
# the entry's options (`labels`, `ignore`, ...) to security updates
updates:
  # Dependencies in `pyproject.toml` and the lock (`uv.lock`), updated
  # together
  - package-ecosystem: uv
    directory: /
    labels: ["type: dependencies"]
    schedule:
      interval: monthly
    versioning-strategy: increase-if-necessary
    groups:
      # Dependencies of the documentation (the `docs` group), in pull
      # requests of their own
      docs-dependencies:
        patterns: ["mkdocs", "mkdocs-*", "pymdown-extensions"]
      # Dependencies match the first group listed
      python-dependencies:
        patterns: ["*"]
  # Actions in the workflows, including the pins of the shared actions of
  # `elixir-cloud-aai/.github` (to the commits of its releases,
  # `@<commit> # vX.Y.Z`)
  - package-ecosystem: github-actions
    directory: /
    labels: ["type: dependencies"]
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
  # Images of the services in `compose.yaml` (engines and the Python image of
  # the shims, stub and mock OIDC issuer; `scripts/test.sh` runs `opa check`
  # with the OPA image of `compose.yaml`). Python is bumped within its minor
  # version only: CI tests with the same minor version (`python-version` in
  # `ci.yml`), so a new one is a change by hand in both places
  - package-ecosystem: docker-compose
    directory: /
    labels: ["type: dependencies"]
    schedule:
      interval: monthly
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      docker-compose:
        patterns: ["*"]
  # The image of the Pulsar server for the TESP smoke run, which CI doesn't
  # build: Python is bumped within its minor version only, as the pinned
  # Pulsar release may not install on a newer one
  - package-ecosystem: docker
    directory: /tes/tesp/pulsar
    labels: ["type: dependencies"]
    schedule:
      interval: monthly
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      docker:
        patterns: ["*"]
  # Hook revisions in `.pre-commit-config.yaml`
  - package-ecosystem: pre-commit
    directory: /
    labels: ["type: dependencies"]
    schedule:
      interval: monthly
    groups:
      pre-commit:
        patterns: ["*"]
