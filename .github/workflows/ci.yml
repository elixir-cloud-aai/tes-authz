# Everything that must pass on pull requests and pushes to `dev`: the pull
# request title, lint (ruff, mypy and the pre-commit hooks), the unit tests,
# the documentation (`mkdocs build --strict`), and all suites against the Docker Compose services (`make test`). The gate
# `passed` ("CI passed") is the only required check. No `paths:` filters, so
# that the gate always reports; skip jobs with `if:` instead (and allow the
# skip in the gate). Runs also when a pull request is edited, so that the
# title check follows the title; all jobs run then, as a run that skipped the
# tests would report "CI passed" for the commit

name: CI
on:
  push:
    branches: [dev]
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [dev]

permissions:
  contents: read

# Only a new head commit of a pull request cancels its runs in progress
# (action `synchronize`, first attempt); runs for other actions and reruns
# wait, so that a run on the same commit never leaves a cancelled, failed
# `CI passed` (see "Cancelled runs" in `actions/gate/README.md` of
# `elixir-cloud-aai/.github`). Runs for pushes get their own group, so that
# none is dropped. Runs for edits that leave the title unchanged (e.g. of
# the description, also by bots) share a group of their own, so that they
# don't wait for the run for the pull request's commit
concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event_name == 'push' && github.sha ||
      github.event.action == 'edited' && !github.event.changes.title &&
        format('{0}-edited', github.ref) ||
      github.ref }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request'
    && github.event.action == 'synchronize'
    && github.run_attempt == 1 }}

jobs:

  # Pull request titles become the commit messages on `dev` (squash merges):
  # Conventional Commits, at most 50 characters (shared action of
  # elixir-cloud-aai/.github, pinned to the commit of a release). Skipped on
  # pushes and for Dependabot, whose titles can't be configured to pass,
  # unless someone else edits the title
  title:
    name: PR title
    if: >-
      github.event_name == 'pull_request' && (
        github.event.pull_request.user.login != 'dependabot[bot]' ||
        github.event.changes.title &&
        github.event.sender.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check PR title
        uses: elixir-cloud-aai/.github/actions/pr-title@bf3840c9c072aaf37d6cafe199aaa1994087d1ef # v1.2.0

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # All jobs use the Python version of the images in `compose.yaml` that
      # run the shims, the stub and the mock OIDC issuer
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # uv, at the version locked in `uv.lock` (a dev dependency); the action
      # checks its checksum
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: uv.lock
      # `uv sync --locked` below fails too if the lock doesn't match
      # `pyproject.toml`, but this step names the failure (run `uv lock`
      # after changing dependencies)
      - name: Check lock file
        run: uv lock --check
      # The versions of `uv.lock`, into `.venv` (where the Makefile expects
      # them), with the Python set up above
      - name: Install dependencies
        run: |
          uv sync --locked --python "$(which python)"
          echo "${PWD}/.venv/bin" >> "$GITHUB_PATH"
      # ruff (lint and format) and mypy, as locally
      - name: Run linters and type checks
        run: make lint
      - name: Cache pre-commit hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      # The other hooks (`make lint` above ran ruff and mypy), and gitleaks on
      # the whole checkout
      - name: Run pre-commit hooks
        env:
          SKIP: ruff-check,ruff-format,mypy
        run: |
          pre-commit run --all-files --show-diff-on-failure
          pre-commit run --all-files --hook-stage manual gitleaks-all

  # The tests that need no containers
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # As in `lint`
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: uv.lock
      - name: Install dependencies
        run: uv sync --locked --python "$(which python)"
      - name: Run unit tests
        run: make unit

  # Everything `make test` runs (`scripts/test.sh`): lint, types, `opa check`,
  # then the Docker Compose services (engines, shims, stub and mock OIDC
  # issuer) and all suites against them, with the mock TES. The services are
  # kept until the logs are shown, then removed
  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TES_AUTHZ_PROJECT: tes-authz-ci
      TES_AUTHZ_PORT_BASE: "18080"
      TES_AUTHZ_KEEP: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # As in `lint`
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: uv.lock
      - name: Install dependencies
        run: uv sync --locked --python "$(which python)"
      - name: Run all suites against the services
        run: make test
      - name: Show service logs
        if: failure()
        run: make logs
      - name: Stop services
        if: always()
        run: make down

  # The documentation, as Read the Docs builds it (`.readthedocs.yaml`)
  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Python version of Read the Docs (`.readthedocs.yaml`)
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # As in `lint`
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: uv.lock
      # The versions of `uv.lock`, as in `lint`
      - name: Install dependencies
        run: |
          uv sync --locked --group docs --python "$(which python)"
          echo "${PWD}/.venv/bin" >> "$GITHUB_PATH"
      # Fails on warnings, e.g., of broken links and anchors
      - name: Build documentation
        run: mkdocs build --strict

  # The only required check: passes if every other job passed, or was skipped
  # where that is intended (`title` on pushes and for Dependabot). Any other
  # result (failure, cancelled, or an unintended skip) fails it. Add every
  # new job to `needs`
  passed:
    name: CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [title, lint, test, docs, integration]
    permissions: {}
    steps:
      - name: Check results of all jobs
        uses: elixir-cloud-aai/.github/actions/gate@bf3840c9c072aaf37d6cafe199aaa1994087d1ef # v1.2.0
        with:
          needs: ${{ toJSON(needs) }}
          # `title` is skipped on purpose on pushes and for Dependabot
          allow-skipped: title
