# Release when a version tag (`vX.Y.Z`, or a pre-release such as
# `vX.Y.Zrc1`) is pushed: check the tag, the commit, the versions in
# `pyproject.toml` and `CITATION.cff`, that CI passed for a push of the
# commit to `dev` (shared action `elixir-cloud-aai/.github/actions/
# check-release`) and the curated release notes (`docs/releases/
# <version>.md`) (`prepare`); build the decision service image
# (`Dockerfile`: OPA, the AuthZEN front and the policy of the tagged commit;
# with SBOM and provenance attestations) and push it by digest, untagged
# (`push`); scan exactly that digest for vulnerabilities in a job of its
# own, without the release credentials and signing identity (`scan`); and
# only then attest its build provenance, sign it (Sigstore keyless signing)
# and tag it with the version (`release-image`). Last, create the GitHub
# release with the curated notes followed by GitHub's generated notes
# (`publish`, shared action `elixir-cloud-aai/.github/actions/
# publish-release`), a pre-release until 1.0.0. `push` and `release-image`
# each need approval in the `release` environment (required reviewer,
# Docker Hub secrets `DOCKERHUB_LOGIN` and `DOCKERHUB_TOKEN`). Re-running
# all jobs builds, scans and signs a new digest, but stops before building
# if the version tag of the image exists (released images don't change);
# re-running failed jobs reuses the digest of the earlier attempt.
# `prepare` fails if a published release of the tag exists already. The
# image holds no policy data and no settings: they are passed when it
# starts (`docs/image.md`). Nothing is tagged `latest`. Release commits are
# on `dev`, the default branch. See "Releases" in `docs/contributing.md`.
# Adapted from the release workflow of nvflare-wes-testbed.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Fully qualified (`docker.io/`), as the attestation needs it. The Docker Hub
# organization is the repository variable `DOCKERHUB_ORG` (by default
# `elixircloud`), so that forks can publish to their own organization (set
# it in the fork before pushing a test tag)
env:
  IMAGE_NAME: docker.io/${{ vars.DOCKERHUB_ORG || 'elixircloud' }}/tes-authz

# One run per tag, so that a run waiting for approval is not cancelled by
# the run of another tag
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # read the CI runs of the release commit
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # For the package version and the release notes; check-release itself
      # reads everything from the GitHub API
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read package version
        id: package
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      # The tag (annotated, signature verified by GitHub, pointing to the
      # commit of the run), the commit (on `dev`, CI passed for a push of
      # it), `CITATION.cff` and the package version. Guards against
      # accidental releases; the `release` environment's protection rules
      # (required reviewer) are what actually control publishing
      - name: Check release tag and commit
        id: release
        uses: elixir-cloud-aai/.github/actions/check-release@bf3840c9c072aaf37d6cafe199aaa1994087d1ef # v1.2.0
        with:
          branch: dev
          version: ${{ steps.package.outputs.version }}
      # The GitHub release (`publish`) starts with the curated notes of the
      # tagged commit, so they must exist and be in the organization's
      # format before anything is published; also checks that no published
      # release of the tag exists
      - name: Check release notes
        uses: elixir-cloud-aai/.github/actions/publish-release@bf3840c9c072aaf37d6cafe199aaa1994087d1ef # v1.2.0
        with:
          notes: docs/releases/${{ steps.release.outputs.version }}.md
          commit: ${{ steps.release.outputs.sha }}
          check-only: "true"

  # Builds the image of the release commit once and pushes it by digest only
  # (untagged, with SBOM and provenance attestations), for `scan` to scan and
  # `release-image` to sign and tag. Digests of runs that fail (or fail the
  # scan) are never signed or tagged, but stay on Docker Hub, untagged
  push:
    name: Push release image
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Docker Hub secrets (required reviewer)
    environment: release
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      # The commit checked by `prepare`
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # OCI labels with the version, commit and source; `tags` only sets the
      # version label (the image is tagged by digest in `release-image`,
      # after the scan)
      - name: Generate image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: type=raw,value=${{ needs.prepare.outputs.version }}
      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Released images don't change: if the version tag exists (e.g. when
      # re-running all jobs of a release), stop before building
      - name: Check that the version isn't released yet
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # The digest of the version tag, if it exists; errors other than
          # "not found" stop the run, so that it never passes by mistake
          status=0
          output="$(docker buildx imagetools inspect "${IMAGE_NAME}:${VERSION}" \
            --format '{{ json .Manifest }}' 2>&1)" || status=$?
          current=""
          if [[ "${status}" == 0 ]]; then
            current="$(jq -r .digest <<< "${output}")"
          elif ! grep -qiE 'not found|manifest unknown' <<< "${output}"; then
            echo "::error::Cannot check whether ${IMAGE_NAME}:${VERSION} exists: ${output}"
            exit 1
          fi
          if [[ -n "${current}" ]]; then
            echo "::error::${IMAGE_NAME}:${VERSION} exists already (${current}); release a new version instead"
            exit 1
          fi
      - name: Build and push image by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          labels: ${{ steps.meta.outputs.labels }}

  # Scans exactly the pushed digest (public, so pulling it needs no login)
  # with Trivy (shared action `elixir-cloud-aai/.github/actions/scan-image`;
  # fails on fixable critical and high vulnerabilities and on pip). Kept
  # apart from `push`, `release-image` and `publish`, so that Trivy never
  # runs next to the Docker Hub credentials, the `contents: write` token and
  # the signing identity
  scan:
    name: Scan release image
    needs: [prepare, push]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # For `.trivyignore.yaml` of the release commit
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Check image digest
        env:
          DIGEST: ${{ needs.push.outputs.digest }}
        run: |
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid image digest '${DIGEST}'"
            exit 1
          fi
      - name: Scan image
        uses: elixir-cloud-aai/.github/actions/scan-image@bf3840c9c072aaf37d6cafe199aaa1994087d1ef # v1.2.0
        with:
          image: ${{ env.IMAGE_NAME }}@${{ needs.push.outputs.digest }}
          category: release
          upload: "false"
          fail-on-pip: "true"

  # Attests the build provenance of the scanned digest, signs it, and tags
  # it with the version
  release-image:
    name: Release image
    needs: [prepare, push, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write # Sigstore signing certificates
      attestations: write # GitHub artifact attestations
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      DIGEST: ${{ needs.push.outputs.digest }}
    steps:
      - name: Check image digest
        run: |
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid image digest '${DIGEST}'"
            exit 1
          fi
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Released images don't change: a version tag of another digest stops
      # the run before this digest is attested and signed (the same digest,
      # e.g. when re-running failed jobs, is fine)
      - name: Check the version tag
        run: |
          status=0
          output="$(docker buildx imagetools inspect "${IMAGE_NAME}:${VERSION}" \
            --format '{{ json .Manifest }}' 2>&1)" || status=$?
          current=""
          if [[ "${status}" == 0 ]]; then
            current="$(jq -r .digest <<< "${output}")"
          elif ! grep -qiE 'not found|manifest unknown' <<< "${output}"; then
            echo "::error::Cannot check whether ${IMAGE_NAME}:${VERSION} exists: ${output}"
            exit 1
          fi
          if [[ -n "${current}" && "${current}" != "${DIGEST}" ]]; then
            echo "::error::${IMAGE_NAME}:${VERSION} already points to ${current}; release a new version instead"
            exit 1
          fi
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true
          # No artifact metadata storage record (needs another permission)
          create-storage-record: false
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      # The signature covers the digest, and so every tag of it
      - name: Sign image
        run: cosign sign --yes "${IMAGE_NAME}@${DIGEST}"
      # The version tag points to the checked, scanned and signed digest
      - name: Tag image
        run: |
          tag="${IMAGE_NAME}:${VERSION}"
          docker buildx imagetools create --tag "${tag}" "${IMAGE_NAME}@${DIGEST}"
          actual="$(docker buildx imagetools inspect "${tag}" \
            --format '{{ json .Manifest }}' | jq -r .digest)"
          if [[ "${actual}" != "${DIGEST}" ]]; then
            echo "::error::${tag} points to ${actual}, expected ${DIGEST}"
            exit 1
          fi

  # Creates the GitHub release of the tag once the image is released: the
  # curated notes of the tagged commit (`docs/releases/<version>.md`), then
  # GitHub's generated notes under `## Commits`, with the
  # `**Full Changelog**` line last; a pre-release for versions below 1.0.0.
  # No environment: it needs no secrets, only `contents: write`. The tag must
  # still point to the release commit. One at a time, so that the latest
  # release is decided in order
  publish:
    name: Publish release
    needs: [prepare, release-image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-publish-release
      cancel-in-progress: false
    permissions:
      contents: write # create the release
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Create release
        uses: elixir-cloud-aai/.github/actions/publish-release@bf3840c9c072aaf37d6cafe199aaa1994087d1ef # v1.2.0
        with:
          notes: docs/releases/${{ needs.prepare.outputs.version }}.md
          commit: ${{ needs.prepare.outputs.sha }}
