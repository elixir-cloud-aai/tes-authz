site_name: TES AuthZ
site_description: >-
  The TES AuthZ specification (tes-authzen/1) and its reference tooling
  by ELIXIR On-Cloud
# Read the Docs serves each version under its own path (e.g., `/en/latest/`)
site_url: !ENV [READTHEDOCS_CANONICAL_URL, "https://tes-authz.readthedocs.io/en/latest/"]
repo_url: https://github.com/elixir-cloud-aai/tes-authz
repo_name: elixir-cloud-aai/tes-authz
edit_uri: edit/dev/docs/
copyright: Copyright &copy; ELIXIR On-Cloud

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Specification: specification.md
  - Reference tooling:
      - Getting started: getting-started.md
      - Operators: operators.md
      - Adding a TES: adding-a-tes.md
      - Adding an engine: adding-an-engine.md
      - Testing: testing.md
      - Findings: findings.md
  - Contributing: contributing.md
