# Checks run on commit (`uv run pre-commit install`) and in CI (`pre-commit
# run --all-files`, plus the manual-stage `gitleaks-all` hook); hook
# versions are pinned to commits. ruff and mypy run as in `make lint`, and
# ast-grep, with the versions of `uv.lock`
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-json
      - id: check-toml
      - id: check-yaml
        # The Kubernetes manifest holds several objects (documents)
        args: [--allow-multiple-documents]
        # `mkdocs.yml` uses MkDocs' `!ENV` tag (the docs build checks it)
        exclude: ^mkdocs\.yml$
      - id: end-of-file-fixer
      - id: trailing-whitespace
  # Project rules and their tests in `.semgrep/`
  - repo: https://github.com/semgrep/pre-commit
    rev: 14ad2383dd6f19216cc78ba8ea1d4f607fc29df1  # frozen: v1.185.0
    hooks:
      - id: semgrep
        args:
          - --config=.semgrep
          - --error
          - --metrics=off
          - --disable-version-check
          - --quiet
          - --skip-unknown-extensions
        # The rule tests contain findings on purpose
        exclude: ^\.semgrep/
      - id: semgrep
        alias: semgrep-test
        name: semgrep rule tests
        # semgrep finds no tests in hidden directories passed as targets
        entry: >-
          sh -c 'cd .semgrep &&
          semgrep --test --metrics=off --disable-version-check --quiet .'
        files: ^\.semgrep/
        pass_filenames: false
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      # Staged changes on commit
      - id: gitleaks
      # The whole checkout, in CI (`--hook-stage manual`); also scans
      # untracked and ignored files when run locally
      - id: gitleaks
        alias: gitleaks-all
        name: Detect hardcoded secrets (all files)
        entry: gitleaks dir --redact --verbose
        stages: [manual]
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      # Workflows (`.github/workflows/`); also checks their scripts with
      # shellcheck if it is installed (as on GitHub-hosted runners)
      - id: actionlint
  - repo: local
    hooks:
      # The commands of `make lint`, with the dev dependencies of
      # `pyproject.toml` (run `uv sync` first); mypy checks the paths of
      # `files` in `pyproject.toml`
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
      # Project rules of ast-grep and their tests in `.ast-grep/`
      # (`sgconfig.yml`)
      - id: ast-grep
        name: ast-grep
        entry: uv run ast-grep scan
        language: system
        types: [python]
      - id: ast-grep-test
        name: ast-grep rule tests
        entry: uv run ast-grep test --skip-snapshot-tests
        language: system
        files: ^(sgconfig\.yml|\.ast-grep/)
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
