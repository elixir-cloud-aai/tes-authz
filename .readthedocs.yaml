# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    # Python version of CI (`ci.yml`) and of the images in `compose.yaml`
    python: "3.13"
  # The repository is no installable package (`tool.uv.package = false`),
  # so the docs dependency group is installed with uv from the lock
  # (`uv.lock`): the same versions that CI's docs job builds with
  jobs:
    # The version of uv locked in `uv.lock` (a dev dependency, as for CI),
    # run as a module: asdf, which provides Python here, has no shim for
    # the `uv` executable;
    # `tests/test_readthedocs.py` fails when a lock update moves it
    pre_create_environment:
      - python -m pip install "uv==0.13.8"
    create_environment:
      - python -m uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" python -m uv sync --frozen --only-group docs

mkdocs:
  configuration: mkdocs.yml
  # Fail on all warnings to avoid broken links and references
  fail_on_warning: true
