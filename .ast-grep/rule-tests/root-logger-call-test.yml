id: root-logger-call
valid:
  - log.info("listening on port %d", port)
  - logging.getLogger(__name__).warning("Retrying")
  - logging.getLogger(name="tes-authz-shim").info("Started")
  - logging.basicConfig(level=logging.INFO)
  - from logging import getLogger
invalid:
  - logging.info("Started")
