id: root-logger-call
language: python
severity: error
message: Message logged with the root logger
note: |
  Log with the module's logger (`log = logging.getLogger("tes-authz-...")`
  or `logging.getLogger(__name__)`), so that log messages can be
  configured by logger name.
rule:
  any:
    - pattern: logging.$METHOD($$$ARGS)
    - pattern: logging.root.$METHOD($$$ARGS)
    - pattern: logging.getLogger().$METHOD($$$ARGS)
    # The keyword form first: the constraint on `$NAME` is checked only
    # after `any` has picked a branch
    - pattern: logging.getLogger(name=$NAME).$METHOD($$$ARGS)
    - pattern: logging.getLogger($NAME).$METHOD($$$ARGS)
    # The module-level functions imported by name (`from logging import info`)
    - kind: import_from_statement
      all:
        - has:
            field: module_name
            regex: ^logging$
        - has:
            any:
              - kind: dotted_name
              - kind: aliased_import
            regex: ^(debug|info|warning|warn|error|exception|critical|fatal|log|root)(\s+as\s+\w+)?$
constraints:
  NAME:
    regex: ^(None|""|''|"root"|'root')$
  METHOD:
    regex: ^(debug|info|warning|warn|error|exception|critical|fatal|log)$
